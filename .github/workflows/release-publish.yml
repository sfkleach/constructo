# Publishes a release whose draft release-draft.yml has made: both crates to crates.io, constructo-runtime first,
# and then the draft on GitHub. `just publish-release VERSION` runs it. Only a stable tag, vX.Y.Z, is published.
#
# It has no token of its own: crates.io gives it one by trusted publishing, which is set up on the page of each crate
# for this repository and this workflow's file name. crates.io gives that only to a crate that exists, so the first
# release of each crate is published by hand, with `cargo publish --workspace` from the tag, and this publishes
# every later one.
name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of the release, as v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a tag that is not a stable release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $TAG is not a stable release, vX.Y.Z, and only those are published."
            exit 1
          fi

      # The draft is the record that release-draft.yml tested the tag, so a tag without one is not published.
      - name: Check that the tag has a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$draft" != "true" ]]; then
            echo "::error::The release $TAG is not a draft, so it has been published already or was not made."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Get a token from crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Cargo orders the workspace by its dependencies, so constructo-runtime is published before constructo.
      - name: Publish both crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
