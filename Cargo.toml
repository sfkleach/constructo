[package]
name = "constructo"
version = "0.1.0"
edition = "2021"
description = "A typed, simple-object notation, and tools for processing it"
license = "MIT"
repository = "https://github.com/sfkleach/constructo"
# The tooling of the repository, which a user of the crate does not need.
exclude = [".cargo/", ".claude/", ".coderabbit.yaml", ".github/", ".local/", "CLAUDE.md", "Justfile", "tests/"]

[lib]
name = "constructo"
path = "src/lib.rs"

[[bin]]
name = "constructo"
path = "src/main.rs"

[dependencies]
constructo-runtime = { version = "=0.1.0", path = "constructo-runtime" }
# The default features less `color`, which reads NO_COLOR, CLICOLOR, TERM and others from the environment.
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "suggestions",
] }
glob = "0.3.4"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"

[workspace]
members = ["constructo-runtime"]
resolver = "2"

[profile.release]
lto = true

