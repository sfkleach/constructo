[package]
name = "constructo"
version = "0.1.0"
edition = "2021"
description = "A typed, simple-object notation, and tools for processing it"
license = "MIT"
repository = "https://github.com/sfkleach/constructo"

[lib]
name = "constructo"
path = "src/lib.rs"

[[bin]]
name = "constructo"
path = "src/main.rs"

[dependencies]
# The default features less `color`, which reads NO_COLOR, CLICOLOR, TERM and others from the environment.
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "suggestions",
] }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"

[profile.release]
lto = true

